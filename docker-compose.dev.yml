# Dev overlay: hot reload, exposed ports, polling mode for the bot, no Caddy
# requirement. Use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  caddy:
    profiles: ["never"]   # skip caddy in dev — bot uses polling, api is local

  api:
    build:
      target: dev
    command: >
      uv run uvicorn mnemo_api.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src
    volumes:
      - ./services/api/src:/app/src
      - ./services/api/tests:/app/tests
    ports:
      - "8000:8000"
      - "9100:9100"
    environment:
      MNEMO_ENV: development
      MNEMO_LOG_LEVEL: DEBUG

  bot:
    build:
      target: dev
    command: uv run python -m mnemo_bot.main
    volumes:
      - ./services/bot/src:/app/src
    environment:
      MNEMO_ENV: development
      MNEMO_LOG_LEVEL: DEBUG
      TELEGRAM_MODE: polling      # no public URL needed in dev
      MNEMO_API_BASE_URL: http://api:8000

  workers:
    build:
      target: dev
    command: uv run dramatiq mnemo_workers.tasks --watch /app/src
    volumes:
      - ./services/workers/src:/app/src

  postgres:
    ports:
      - "5432:5432"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  n8n:
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5678/
