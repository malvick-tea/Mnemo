[project]
name = "mnemo-bot"
version = "0.1.0"
description = "Mnemo Telegram bot (aiogram 3)"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "aiogram==3.15.0",
    "aiohttp==3.10.11",
    # aiogram 3.15 pins pydantic <2.10. Keep the bot on the newest
    # compatible 2.9.x line until aiogram lifts that bound.
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "redis==5.2.1",
    "pyjwt==2.10.1",
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemo_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
