<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mnemo{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 980px; margin: 2em auto; padding: 0 1em; line-height: 1.5;
    }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header small { opacity: 0.6; }
    nav a { margin-right: 1em; }
    .card {
      border: 1px solid rgba(125,125,125,0.25); border-radius: 8px;
      padding: 0.75em 1em; margin: 0.6em 0;
    }
    .card h3 { margin: 0 0 0.3em 0; font-size: 1.05rem; }
    .meta { font-size: 0.85rem; opacity: 0.7; }
    .tag {
      display: inline-block; padding: 0.1em 0.5em; margin-right: 0.25em;
      border: 1px solid rgba(125,125,125,0.3); border-radius: 999px;
      font-size: 0.8rem;
    }
    pre { white-space: pre-wrap; word-wrap: break-word; }
    .footer { margin-top: 3em; opacity: 0.5; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">Mnemo</a></h1>
    <small>admin · v{{ version }}</small>
  </header>
  <nav>
    <a href="/">Notes</a>
  </nav>
  {% block content %}{% endblock %}
  <div class="footer">
    Phase-4 placeholder. The bot is the primary UI.
  </div>
</body>
</html>
