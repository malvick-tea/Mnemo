[project]
name = "mnemo-workers"
version = "0.1.0"
description = "Mnemo background workers (Dramatiq + Redis)"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "dramatiq[redis]==1.17.1",
    "apscheduler==3.10.4",
    "asyncpg==0.30.0",
    "sqlalchemy[asyncio]==2.0.36",
    "qdrant-client==1.12.1",
    "redis==5.2.1",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "minio==7.2.12",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "prometheus-client==0.21.1",
    # Shared with API; we re-import via path mount in compose.
    "mnemo-api @ file:///app/../api",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemo_workers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dramatiq.*", "minio.*", "qdrant_client.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
