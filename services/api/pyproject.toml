[project]
name = "mnemo-api"
version = "0.1.0"
description = "Mnemo Core API — capture, search, RAG, settings"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "../../README.md"

dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "asyncpg==0.30.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "qdrant-client==1.12.1",
    "redis==5.2.1",
    "dramatiq[redis]==1.17.1",
    "minio==7.2.12",
    "jinja2==3.1.4",
    "python-multipart==0.0.19",
    "cryptography==44.0.0",
    "pyjwt==2.10.1",
    "prometheus-client==0.21.1",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-exporter-otlp-proto-http==1.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "hypothesis==6.122.3",
    "testcontainers[postgres]==4.9.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-redis==4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemo_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "TCH", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dramatiq.*", "minio.*", "qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit real Postgres/Qdrant/Redis via testcontainers",
    "eval: RAG eval tests; slow",
]
addopts = "-ra --strict-markers"
