name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.13"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, bot, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Ruff
        working-directory: services/${{ matrix.service }}
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .
      - name: mypy
        working-directory: services/${{ matrix.service }}
        run: |
          source .venv/bin/activate
          mypy --strict src

  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, bot, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Unit tests
        working-directory: services/${{ matrix.service }}
        env:
          MNEMO_SERVICE_JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x' }}
          MNEMO_WEBHOOK_HMAC_SECRET: ${{ secrets.CI_HMAC_SECRET || 'y_y_y_y_y_y_y_y_y_y_y_y_y_y_y_y' }}
          MNEMO_ENCRYPTION_KEY: ${{ secrets.CI_ENC_KEY || 'enpaWZua29tZXRyaW5seGd2aGRsanNkanc=' }}
          TELEGRAM_BOT_TOKEN: dummy:dummy
        run: |
          source .venv/bin/activate
          pytest -q -m "not integration and not eval"

  integration-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mnemo
          POSTGRES_PASSWORD: mnemo
          POSTGRES_DB: mnemo_test
        options: >-
          --health-cmd "pg_isready -U mnemo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports: ["6333:6333"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install api
        working-directory: services/api
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Integration tests
        working-directory: services/api
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: mnemo
          POSTGRES_PASSWORD: mnemo
          POSTGRES_DB: mnemo_test
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379/0
          MNEMO_SERVICE_JWT_SECRET: x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x
          MNEMO_WEBHOOK_HMAC_SECRET: y_y_y_y_y_y_y_y_y_y_y_y_y_y_y_y
          MNEMO_ENCRYPTION_KEY: enpaWZua29tZXRyaW5seGd2aGRsanNkanc=
          MINIO_ACCESS_KEY: mnemo
          MINIO_SECRET_KEY: mnemo_secret
          MNEMO_LLM_PROVIDER: ollama
        run: |
          source .venv/bin/activate
          alembic upgrade head
          pytest -q -m integration

  build-images:
    runs-on: ubuntu-24.04
    needs: [lint, unit-tests]
    strategy:
      matrix:
        service: [api, bot, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          target: prod
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
